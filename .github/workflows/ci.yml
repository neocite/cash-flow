name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  services:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service: [entries, balance]
    defaults:
      run:
        working-directory: services/${{ matrix.service }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: services/${{ matrix.service }}/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - name: Integration tests (in-memory MongoDB replica set)
        run: npm run test:integration
      - run: npm run build
